<!DOCTYPE html>
<html>

<head>
    <title>Contacts</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body onload="fetchContacts()">

    <div class="main-container">
        <h1>ContactBook</h1>

        <div id="contacts-scroll-area">
            <div id="table">
                contacts loading
            </div>
        </div>

        <div class="button-container">
            <button id="refresh" type="button">Refresh</button>
            <button id="addContact" type="button">Add Contact</button>
        </div>
    </div>


    <script src="config.js"></script>

    <script>
        document.getElementById("refresh").addEventListener('click', fetchContacts);
        document.getElementById("addContact").addEventListener('click', addContact);

        function fetchContacts() {
            fetch(rootPath + "controller/get-contacts/")
                .then(function(response) {
                    return response.json();
                })
                .then(function(data) {
                    displayOutput(data);
                })
                .catch(function(error) {
                    console.error("Error fetching contacts:", error);
                    document.getElementById("table").innerHTML = "<p>Failed to load contacts. Please try again.</p>";
                });
        }

        function displayOutput(data) {
            output = "";
            if (data && data.length > 0) {
                for (a in data) {
                    output += `
                        <div class="contact-card" onclick="editContact(${data[a].id})">
                            <div class="contact-avatar">
                                <img src="${rootPath}controller/uploads/${data[a].avatar}" alt="${data[a].firstname} ${data[a].lastname}" width="60"/>
                            </div>
                            <div class="contact-details">
                                <h3>${data[a].firstname} ${data[a].lastname}</h3>
                                <p><strong>Mobile:</strong> ${data[a].mobile || 'N/A'}</p>
                                <p><strong>Email:</strong> ${data[a].email || 'N/A'}</p>
                            </div>
                        </div>
                    `;
                }
            } else {
                output = "<p>No contacts found. Add some!</p>";
            }
            document.getElementById("table").innerHTML = output;
        }

        function addContact() {
            window.open("add-contact.html", "_self");
        }

        function editContact(id) {
            window.open("edit-contact.html?id=" + id, "_self")
        }
    </script>
</body>

</html>
